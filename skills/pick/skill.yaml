name: pick
description: >-
  Grasp an object and lift it clear of the surface. Only works when the
  gripper is empty and the object is within reach. Fails if the gripper
  closes on nothing, or if the object slips before reaching lift height.

timeout_s: 15.0

max_attempts: 5

reach_dist_in_meters: 0.8

args:
  object_id:
    type: string
    description: Which object to pick up.
    enum: [red_cube, orange_cube, yellow_cube, green_cube, blue_cube, purple_cube]

required: [object_id]

preconditions:
  - gripper_empty
  - object_within_reach

outcomes:
  success:
    predicates:
      - object_height_above_surface
    hold_s: 1.0
    threshold: 0.10
    next_action: report
  failure:
    predicates:
      - nothing_between_fingers
      - object_dropped_threshold
    next_action: retry_new_angle
  timeout:
    description: Did not succeed within the time limit.
    next_action: retry_new_angle
