[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobot"
version = "0.1.0"
description = "Plain-English control of a simulated robot arm: LLM planner, RL skill, RGB-D vision, and VLM verification in MuJoCo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.17",
    "numpy>=2.0",
    "openai>=3.0",
    "opencv-python-headless>=5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# everything that runs the arm or trains it, which needs an NVIDIA GPU
# exact versions, because brax 0.14.2 crashes on newer JAX
sim = [
    "brax==0.14.2",
    "jax[cuda12]==0.9.2",
    "playground==0.2.0",
    "warp-lang==1.19.0",
]
dev = ["pytest>=9.0", "ruff>=0.16"]

[tool.setuptools]
packages = ["evals", "perception", "planner", "sim", "skills", "training"]

[tool.setuptools.package-data]
sim = ["scene.xml"]
skills = ["*/skill.yaml"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
